<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send general queries, feedback, or sponsorship requests to Mutumane Kota 'N' Grilled Chicken.">
  <title>General Enquiry | Mutumane Kota 'N' Grilled Chicken</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- LOGO & NAVIGATION BAR -->
  <header>
    <div>
      <!-- Brand Logo & Title -->
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="Research/Images/LOGO.jpg" alt="Mutumane Logo" width="40" height="40" style="border-radius: 50%; border: 2px solid var(--warm-yellow);">
        <strong style="color: var(--white); font-size: 0.85rem;">MUTUMANE KOTA 'N' GRILLED CHICKEN</strong>
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger-toggle" aria-label="Toggle navigation menu" onclick="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Navigation Links -->
      <nav id="mainNav">
        <ul>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="orders.html">Orders</a></li>
          <li><a href="aboutUs.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="enquiry.html">Enquiry</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <br style="clear: both;">
  <hr>

  <!-- PAGE HEADING -->
  <div align="center">
    <h2>GENERAL ENQUIRY</h2>
    <p>Got a question or feedback? Send us a message below!</p>
  </div>

  <!-- ENQUIRY FORM CONTAINER -->
  <div style="max-width: 700px; margin: 30px auto; background-color: var(--charcoal); padding: 30px; border-radius: 8px; border: 1px solid #333;">
    <h3 style="color: var(--warm-yellow); border-bottom: 1px solid #444; padding-bottom: 8px; margin-top: 0;">Location and Details</h3>

    <form action="#" method="post" id="enquiryForm" novalidate>
      <p>
        <label for="fullname"><strong>Full Name:</strong></label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </p>

      <p>
        <label for="contactInfo"><strong>Contact Info (Email or Phone):</strong></label><br>
        <input type="tel" id="contactInfo" name="contactInfo" placeholder="0813572265" required>
      </p>

      <p>
        <label for="subject"><strong>Subject:</strong></label><br>
        <input type="text" id="subject" name="subject" placeholder="What is this regarding?" required>
      </p>

      <p>
        <label for="message"><strong>Message:</strong></label><br>
        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
      </p>

      <div align="center" style="margin-top: 20px;">
        <input type="submit" value="SEND ENQUIRY" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem; cursor: pointer;">
      </div>
    </form>
  </div>

  <br style="clear: both;">
  
  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Mutumane Kota 'N' Grilled Chicken. All Rights Reserved.</p>
  </footer>

</body>
</html>
